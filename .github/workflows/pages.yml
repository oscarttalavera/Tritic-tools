name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Incluir Trazo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < trazo.version)
          gh release download "$V" --repo oscarttalavera/trazo --pattern "trazo-web-$V.zip" --dir "$RUNNER_TEMP/trazo"
          mkdir -p site/trazo
          unzip -q "$RUNNER_TEMP/trazo/trazo-web-$V.zip" -d site/trazo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
